<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubAlert</title>
    <meta name="description" content="Track free-trial end dates and decide to keep or cancel each subscription before you're charged." />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Set the theme before anything is painted, so a dark-mode visitor never
         sees a white flash while React loads. ThemeContext.jsx takes over from
         here; this only reads the same saved value. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('subalert:theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) document.querySelector('meta[name="theme-color"]').content = '#12161B'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
